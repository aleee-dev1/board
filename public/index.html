<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Board</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-tool="select">
  <div id="board">
    <div id="world">
      <svg id="strings" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <div id="vignette"></div>

    <div id="hint" hidden>Left-drag to move &middot; Wheel to zoom &middot; Right-drag to pan</div>

    <div id="confirm-bar" hidden>
      <span id="confirm-message">Delete this item?</span>
      <button id="confirm-yes" class="yes">Yes</button>
      <button id="confirm-no">No</button>
    </div>

    <div id="rubber-band"></div>

    <header id="toolbar">
      <div class="brand">THE BOARD</div>

      <div class="group" role="group" aria-label="Select">
        <button class="tool active" data-tool="select" title="Select / move (V)" aria-label="Select">
          <svg viewBox="0 0 24 24"><path d="M5 3l13.5 8.2-6.1 1.4-2.6 6.1z" fill="currentColor" stroke="none"/></svg>
        </button>
      </div>

      <div class="group" role="group" aria-label="Add">
        <button class="tool" data-tool="note" title="Add a note (N)" aria-label="Note">
          <svg viewBox="0 0 24 24"><path d="M5 3h14v12l-5 6H5z"/><path d="M14 21v-6h5"/></svg>
        </button>
        <button class="tool" data-tool="image" title="Add images or .txt notes (I)" aria-label="Image / text">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>
        </button>
      </div>

      <div class="group" role="group" aria-label="Edit">
        <button class="tool" data-tool="tape" title="Tape / untape an item (T)" aria-label="Tape">
          <svg viewBox="0 0 24 24"><path d="M4 15l12-9 4 5-12 9z"/><path d="M9 10.5l4 5"/></svg>
        </button>
        <button class="tool" data-tool="string" title="Toggle red string between two items (S)" aria-label="String">
          <svg viewBox="0 0 24 24"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><path d="M6.4 7.6c5 2.2 5 6.6 11.2 8.8"/></svg>
        </button>
      </div>

      <div class="group" role="group" aria-label="Retro">
        <button id="retroToggle" class="toggle on" title="Retro: On" aria-label="Retro filter">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14"/></svg>
        </button>
      </div>

      <div class="group" id="pagination" role="group" aria-label="Boards">
        <button id="slotPrev" title="Previous board" aria-label="Previous board">
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <span id="slotLabel">1</span>
        <button id="slotNext" title="Next board" aria-label="Next board">
          <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <span class="divider"></span>
        <button id="clearBoard" class="clear" title="Delete everything on current board" aria-label="Clear board">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/><path d="M10 11v6M14 11v6"/></svg>
        </button>
      </div>
    </header>
  </div>

  <input type="file" id="fileInput" accept="image/*,.txt,text/plain" multiple hidden />

  <script src="/app.js"></script>
</body>
</html>
